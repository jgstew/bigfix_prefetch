---
name: prefetch_from_url

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prefetch_from_url.yaml"


jobs:
  prefetch_from_url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3"

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install bigfix-prefetch
        run: pip install bigfix-prefetch

      - name: setup output
        run: echo "## Prefetch" >> $GITHUB_STEP_SUMMARY

      - name: run bigfix-prefetch
        run: |
          python -m bigfix_prefetch https://downloads.slack-edge.com/desktop-releases/windows/x64/4.50.121/Slack.msix > output.txt
          cat output.txt
          cat output.txt >> $GITHUB_STEP_SUMMARY
